<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F4F2">
<title>Focusly</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap">
<style>
:root{
  --bg:#F4F4F2;
  --surface:#FFFFFF;
  --surface-2:#F0EEEA;
  --ink:#333333;
  --ink-muted:#706D68;
  --ink-faint:#8A8680;
  --line:#E6E4E0;
  --accent:#7A2F60;
  --accent-strong:#7A2F60;
  --accent-soft:#F3E0EC;
  --highlight:#7A2F60;
  --highlight-soft:#F6E4EF;
  --logo-track:rgba(122,47,96,0.4);
  --logo-arc:#7A2F60;
  --danger:#A8412A;
  --danger-soft:#F3DDD5;
  --shadow:rgba(51,51,51,0.08);
  --now:#7A2F60;
  --pomo:#7A2F60;
  --pomo-track:#E8D5E1;
  --weekend:#F4F4F2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12122B; --surface:#1A1A3A; --surface-2:#22224A; --ink:#FFFFFF;
    --ink-muted:rgba(255,255,255,0.72); --ink-faint:rgba(255,255,255,0.45); --line:rgba(255,255,255,0.12);
    --accent:#A78BFA; --accent-strong:#A78BFA; --accent-soft:rgba(167,139,250,0.14);
    --highlight:#A78BFA; --highlight-soft:#2C2458;
    --logo-track:rgba(255,255,255,0.45); --logo-arc:#A78BFA;
    --danger:#E28B72; --danger-soft:#3A241E; --shadow:rgba(0,0,0,0.45);
    --now:#A78BFA; --pomo:#A78BFA; --pomo-track:#3730A3; --weekend:#161633;
  }
}
:root[data-theme="dark"]{
  --bg:#12122B; --surface:#1A1A3A; --surface-2:#22224A; --ink:#FFFFFF;
  --ink-muted:rgba(255,255,255,0.72); --ink-faint:rgba(255,255,255,0.45); --line:rgba(255,255,255,0.12);
  --accent:#A78BFA; --accent-strong:#A78BFA; --accent-soft:rgba(167,139,250,0.14);
  --highlight:#A78BFA; --highlight-soft:#2C2458;
  --logo-track:rgba(255,255,255,0.45); --logo-arc:#A78BFA;
  --danger:#E28B72; --danger-soft:#3A241E; --shadow:rgba(0,0,0,0.45);
  --now:#A78BFA; --pomo:#A78BFA; --pomo-track:#3730A3; --weekend:#161633;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans", system-ui, sans-serif;
  line-height:1.5; -webkit-font-smoothing:antialiased;
}
#app{max-width:none;width:100%;margin:0;padding:16px 18px 72px;display:flex;flex-direction:column;gap:14px;}
a,button,input,textarea{font-family:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.app-header{padding:4px 4px 8px;display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px;}
.app-header-text{min-width:0;flex:1 1 220px;}
.header-actions{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
.theme-toggle,.mute-btn,.account-chip{
  flex-shrink:0; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-muted);
  height:38px; border-radius:10px; cursor:pointer;
}
.theme-toggle,.mute-btn{width:38px;font-size:1.1rem;}
.account-chip{display:inline-flex;align-items:center;gap:7px;padding:0 12px;font-size:0.85rem;font-weight:600;color:var(--ink);}
.account-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-faint);}
.account-chip .dot.ok{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.theme-toggle:hover,.mute-btn:hover,.account-chip:hover{background:var(--accent-soft);}
.eyebrow{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--ink-muted);font-weight:600;margin-bottom:6px;}
h1{font-family:"Fraunces", Georgia, serif;font-weight:600;font-size:2rem;margin:0;text-wrap:balance;}
.app-logo{margin:0;}
.focusly-logo{
  display:inline-flex;align-items:baseline;font-family:"Source Serif 4", Georgia, serif;
  font-size:1.75rem;font-weight:700;letter-spacing:-0.01em;color:var(--ink);line-height:1;
}
.focusly-ring{
  width:0.6em;height:0.6em;margin:0 0.01em;position:relative;top:0.07em;flex-shrink:0;display:inline-block;
}
.tray-hint{margin:4px 0 0;font-size:0.72rem;color:var(--ink-muted);font-weight:500;font-family:"IBM Plex Sans",system-ui,sans-serif;}
.subtitle{margin:0;color:var(--ink-muted);font-size:0.98rem;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 1px 2px var(--shadow);}
.card h2{font-family:"Fraunces", Georgia, serif;font-weight:600;font-size:1.15rem;margin:0 0 14px;}
.timer-card,.pomo-card{display:flex;flex-direction:column;gap:0;align-items:stretch;}
.timers-row{display:block;margin-bottom:2px;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.timer-card{padding:10px 14px;border-radius:14px;box-shadow:none;background:var(--surface);}
.timer-bar{display:flex;align-items:center;justify-content:center;gap:14px;width:100%;min-height:44px;}
.timer-display{
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  font-size:clamp(1.35rem,3.2vw,1.85rem);font-weight:600;letter-spacing:0.05em;line-height:1;
  color:var(--ink);text-shadow:0 0 18px color-mix(in srgb,var(--ink) 6%,transparent);
}
[data-theme="dark"] .timer-display{color:#f4f4f8;text-shadow:0 0 22px rgba(255,255,255,0.12);}
.timer-controls{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.timer-btn{
  border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;
  transition:transform 0.1s ease,background 0.15s ease,box-shadow 0.15s ease;
}
.timer-btn:active{transform:scale(0.94);}
.timer-btn-play{
  width:44px;height:44px;border-radius:50%;
  background:color-mix(in srgb,var(--pomo) 24%,var(--surface-2));
  box-shadow:0 0 0 1px color-mix(in srgb,var(--pomo) 18%,transparent);
}
.timer-btn-play:hover{background:color-mix(in srgb,var(--pomo) 32%,var(--surface-2));}
.timer-btn-play.is-pause{width:40px;height:40px;border-radius:12px;background:var(--pomo);box-shadow:none;}
.timer-btn-play.is-pause:hover{background:var(--accent-strong);}
.ico-play{
  display:block;width:0;height:0;margin-left:3px;
  border-style:solid;border-width:7px 0 7px 12px;
  border-color:transparent transparent transparent color-mix(in srgb,var(--ink) 82%,transparent);
}
.ico-pause{display:block;width:12px;height:14px;position:relative;}
.ico-pause::before,.ico-pause::after{
  content:"";position:absolute;top:0;width:4px;height:14px;background:#fff;border-radius:1px;
}
.ico-pause::before{left:0;}
.ico-pause::after{right:0;}
.timer-btn-stop{
  width:40px;height:40px;border-radius:12px;background:var(--surface);
  border:1px solid var(--line);
}
.timer-btn-stop:hover{background:var(--surface-2);}
.ico-stop{display:block;width:10px;height:10px;border-radius:50%;background:var(--ink-muted);}
.timer-interval-btn{
  width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;padding:0;
}
.timer-interval-btn:hover{background:var(--surface-2);}
.timer-interval-btn .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-faint);}
.timer-interval-btn .dot.active{background:var(--pomo);box-shadow:0 0 0 3px var(--accent-soft);}
.pomo-card-head-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.account-chip .dot.active{background:var(--pomo);box-shadow:0 0 0 3px var(--accent-soft);}
.pomo-modal .panel{max-width:min(560px,95vw);width:100%;gap:16px;}
.pomo-modal .pomo-card{align-items:stretch;}
.workspace{display:grid;grid-template-columns:minmax(220px,0.9fr) minmax(0,2.6fr);gap:10px;align-items:stretch;height:min(78vh,800px);}
.workspace.log-collapsed{grid-template-columns:48px minmax(0,1fr);}
.workspace > .tl-card,.workspace > .log-card{min-width:0;margin:0;height:100%;max-height:none;}
.log-card{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:hidden;padding:14px;}
.log-card-head,.pomo-card-head,.dash-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0;}
.dash-card-head{justify-content:space-between;}
.log-card-head h2,.pomo-card-head h2,.dash-card-head h2{margin:0;font-size:1.02rem;}
.log-pin{flex-shrink:0;display:flex;flex-direction:column;gap:8px;}
.log-body{overflow:auto;flex:1;display:flex;flex-direction:column;gap:12px;min-height:0;}
.log-rail{
  display:none;width:100%;height:100%;min-height:220px;padding:12px 0;border:0;background:transparent;
  color:var(--ink-muted);cursor:pointer;align-items:center;justify-content:center;
}
.log-rail span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:0.78rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;}
.workspace.log-collapsed .log-card{padding:8px 4px;align-items:stretch;}
.workspace.log-collapsed .log-card-head,
.workspace.log-collapsed .log-pin,
.workspace.log-collapsed .log-body{display:none;}
.workspace.log-collapsed .log-rail{display:flex;}
.dash-modal .panel{max-width:min(1100px,95vw);width:100%;max-height:92vh;padding:22px 26px;gap:16px;}
.dash-modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.dash-modal-head h3{margin:0;}
.dash-charts-row{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:start;}
.dash-chart-card{background:var(--surface-2);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;}
.dash-chart-card h4{margin:0;font-size:0.88rem;font-weight:700;}
.dash-modal .dash-bars{height:190px;}
.dash-modal .dash-body{align-items:center;}
@media (max-width:760px){
  .dash-charts-row{grid-template-columns:1fr;}
}
.nomen-row{display:flex;gap:8px;flex-wrap:wrap;}
.nomen-chip{
  display:inline-flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;
  border:1px dashed var(--line);border-radius:10px;background:transparent;color:var(--ink);
  cursor:pointer;font-size:0.82rem;font-weight:600;
}
.nomen-chip.on{border-style:solid;border-color:var(--accent);background:var(--accent-soft);}
.nomen-ico{
  width:22px;height:22px;border-radius:6px;background:var(--surface-2);color:var(--ink-muted);
  display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;font-size:0.85rem;
}
.quick-add-form{display:flex;gap:6px;align-items:stretch;}
.quick-add-form .quick-add{flex:1;}
.nomen-draft-form{
  display:flex;flex-direction:column;gap:6px;padding:8px 10px;
  border:1px solid var(--line);border-radius:10px;background:var(--surface-2);
}
.nomen-draft-line{display:flex;gap:6px;align-items:center;width:100%;min-width:0;}
.nomen-draft-date{display:flex;align-items:center;gap:8px;font-size:0.72rem;color:var(--ink-muted);font-weight:600;}
.nomen-draft-date input{
  padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);
  font-size:0.82rem;color:var(--ink);font-family:inherit;
}
.nomen-draft-prefix{font-family:"IBM Plex Mono",monospace;font-weight:700;color:var(--accent-strong);flex-shrink:0;}
.nomen-draft-input{
  flex:1;min-width:120px;border:0;background:transparent;outline:0;
  font-size:0.88rem;font-weight:600;color:var(--ink);padding:4px 0;
}
.form-review-block{display:flex;flex-direction:column;gap:8px;}
.form-review-block .check-line{margin:0;}
.form-time-block{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line);}
.form-time-block .field-caption{font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-muted);}
.t-start-timer-wrap .check-line{margin:0;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;width:100%;}
.pomo-modal .pomo-dial{max-width:min(280px,78vw);flex:0 1 auto;width:min(100%,280px);}
.task-marks{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;}
.mark{
  font-size:0.7rem;font-weight:700;padding:2px 8px;border-radius:999px;font-family:"IBM Plex Mono",monospace;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-muted);
}
.mark.tag{background:var(--accent-soft);border-color:transparent;color:var(--accent-strong);}
.mark.project{background:var(--highlight-soft);border-color:transparent;color:var(--highlight);}
.pomo-modal .pomo-card{padding:16px 18px;overflow:auto;align-items:stretch;}
.pomo-modal .pomo-block{flex:1;min-height:0;justify-content:flex-start;}
.pomo-dial{position:relative;width:100%;max-width:360px;aspect-ratio:1;margin:0 auto;flex:1 1 auto;display:flex;align-items:center;min-height:0;}
.pomo-modal .pomo-dial{max-width:min(280px,78vw);flex:0 1 auto;width:min(100%,280px);}
.pomo-dial svg{width:100%;height:100%;display:block;}
.pomo-dial-bg{fill:color-mix(in srgb,var(--surface-2) 55%,transparent);}
.pomo-tick{stroke:var(--pomo);stroke-width:2.4;stroke-linecap:round;filter:drop-shadow(0 0 4px color-mix(in srgb,var(--pomo) 80%,transparent));}
.pomo-tick.elapsed{stroke:var(--pomo-track);opacity:0.45;filter:none;}
.pomo-dial-ui{position:absolute;inset:22%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;pointer-events:none;}
.pomo-dial-duration{font-size:0.78rem;font-weight:500;color:var(--ink-muted);letter-spacing:0.02em;}
.pomo-stop{
  width:42px;height:42px;border-radius:50%;border:0;background:var(--pomo-track);color:var(--pomo);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
}
.pomo-stop span{display:block;width:14px;height:14px;border-radius:3px;background:var(--pomo);}
.pomo-stop.play span{width:0;height:0;border-radius:0;background:transparent;border-top:8px solid transparent;border-bottom:8px solid transparent;border-left:14px solid var(--pomo);margin-left:3px;}
.pomo-remaining{font-family:"IBM Plex Sans",sans-serif;font-size:clamp(2rem,5.5vw,2.75rem);font-weight:600;letter-spacing:-0.04em;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.05;}
.pomo-end-time{font-size:0.82rem;color:var(--ink-muted);display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums;}
.pomo-nudge{display:flex;gap:18px;}
.pomo-nudge button{background:none;border:0;color:var(--pomo);font-weight:600;font-size:0.92rem;cursor:pointer;padding:0;}
.pomo-modal .pomo-dial-ui{inset:20%;gap:5px;}
.pomo-modal .pomo-stop{width:40px;height:40px;}
.pomo-modal .pomo-stop span{width:12px;height:12px;}
.pomo-modal .pomo-stop.play span{border-top-width:7px;border-bottom-width:7px;border-left-width:12px;margin-left:2px;}
.pomo-modal .pomo-remaining{font-size:clamp(1.85rem,8vw,2.35rem);}
.pomo-modal .pomo-nudge{gap:12px;}
.pomo-modal .pomo-nudge button{font-size:0.72rem;}
.pomo-modal .pomo-main{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;}
.pomo-modal .pomo-main .pomo-dial{margin:0;flex-shrink:0;}
.pomo-modal .pomo-play-row{display:flex;align-items:center;justify-content:center;gap:14px;pointer-events:auto;}
.pomo-modal .panel{background:linear-gradient(165deg,color-mix(in srgb,var(--surface) 92%,var(--pomo) 8%) 0%,var(--surface) 55%);}
.pomo-modal .pomo-settings{display:flex;flex-direction:row;flex-wrap:wrap;gap:12px;padding-top:0;border-top:0;width:100%;justify-content:center;}
.pomo-modal .pomo-setting input{max-width:100px;}
.pomo-modal .pomo-setting input{width:100%;}
.view-switch{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2);flex-shrink:0;}
.view-switch button{
  width:36px;height:32px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--ink);
  cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
}
.view-switch button:last-child{border-right:0;}
.view-switch button.on{background:var(--accent-soft);color:var(--accent);}
.view-switch svg{display:block;}
.tl-dayhead{cursor:pointer;}
.tl-split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(180px,1fr);gap:10px;flex:1;min-height:0;}
.tl-split-side{overflow:auto;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:0;background:var(--surface);}
.tl-agenda{overflow:auto;flex:1;min-height:0;padding:4px 8px 8px;}
.tl-agenda-day{margin-bottom:14px;}
.tl-agenda-head{font-weight:700;font-size:0.88rem;padding:6px 2px 8px;border-bottom:1px solid var(--line);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;}
.tl-agenda-item{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-radius:8px;}
.tl-agenda-item:hover{background:var(--surface-2);}
.tl-agenda-time{font-variant-numeric:tabular-nums;color:var(--ink-muted);width:46px;flex-shrink:0;font-size:0.78rem;padding-top:2px;}
.tl-agenda-title{font-weight:600;font-size:0.88rem;overflow-wrap:anywhere;}
.tl-month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:auto repeat(6,minmax(0,1fr));flex:1;min-height:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);}
.tl-month-dow{text-align:center;font-size:0.72rem;font-weight:700;padding:8px 4px;color:var(--ink-muted);background:var(--surface-2);border-bottom:1px solid var(--line);}
.tl-month-cell{min-height:0;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;overflow:hidden;display:flex;flex-direction:column;gap:3px;}
.tl-month-cell:nth-child(7n){border-right:0;}
.tl-month-cell.out{opacity:0.42;}
.tl-month-cell.today{background:var(--accent-soft);}
.tl-month-cell.weekend{background:var(--weekend);}
.tl-month-num{font-size:0.78rem;font-weight:700;}
.tl-month-chip{font-size:0.62rem;padding:2px 5px;border-radius:4px;background:var(--accent-soft);color:var(--accent-strong);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pomo-task-pick{width:100%;flex-shrink:0;}
.timer-row{display:flex;align-items:center;width:100%;}
.pomo-timer-row{display:flex;align-items:center;gap:20px;flex-wrap:wrap;width:100%;}
.pomo-card-head h2{margin:0;font-size:1.02rem;}
.mute-btn{width:34px;height:34px;border-radius:8px;font-size:1rem;}
.pomo-block{display:flex;flex-direction:column;gap:14px;width:100%;}
.pomo-phase-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.pomo-badge{font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;padding:4px 11px;border-radius:999px;}
.pomo-badge-focus{background:var(--accent-soft);color:var(--accent-strong);}
.pomo-badge-break{background:var(--highlight-soft);color:var(--highlight);}
.pomo-set{font-size:0.82rem;color:var(--ink-muted);font-weight:500;}
.pomo-progress{width:100%;height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden;}
.pomo-progress-fill{height:100%;width:0;background:var(--accent);border-radius:999px;}
.pomo-progress-fill.break{background:var(--highlight);}
.pomo-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.pomo-settings{display:flex;gap:16px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line);width:100%;}
.pomo-setting{display:flex;flex-direction:column;gap:4px;font-size:0.72rem;color:var(--ink-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.03em;}

    const seconds = dayEntries.reduce(function(s, e){ return s + entrySeconds(e); }, 0);

}

function computeDashSlices(){

function dashDayBuckets(bounds){

    if (filter.length && filter.indexOf(entryDashLabel(e)) < 0) return;

      buckets.push({ key: iso, label: String(d.getDate()), seconds: totals[iso] || 0 });
    }

    let cursor = mondayOf(from);
    while (cursor <= to){

}

function playTones(freqs){
  if (muted) return;
  const ctx = getAudioCtx();
  if (!ctx) return;
  if (ctx.state === "suspended") ctx.resume().catch(function(){});
  let t = ctx.currentTime + 0.02;
  freqs.forEach(function(f){
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = f;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.22, t + 0.02);
    gain.gain.linearRampToValueAtTime(0, t + 0.22);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 0.24);
    t += 0.26;
  });
}

function collectDayBlocks(d, ownedIds){

  tasksOn(d.iso).forEach(function(t){
    if (t.done && !showDone) return;
    const start = parseTimeMins(t.time);
    const label = taskDisplayName(t);
    if (start == null){
      allDay.push({ cls: "tl-chip", title: label, id: t.id, kind: "task" });
      return;
    }
    const clipped = clipDayMins(start, start + 60);
    if (clipped) timed.push({ cls: "tl-block task" + (t.done ? " done" : ""), title: label, start: clipped.start, end: clipped.end, id: t.id, kind: "task" });
  });
  agendaOn(d.iso).forEach(function(a){
    const start = parseTimeMins(a.time);
    const label = kindLabel(a.kind) + ": " + a.title;
    if (start == null){
      allDay.push({ cls: "tl-chip", title: label });
      return;
    }
    const clipped = clipDayMins(start, start + 60);
    if (clipped) timed.push({ cls: "tl-block agenda-" + (a.kind || "meta"), title: a.title, start: clipped.start, end: clipped.end });
  });
  d.entries.forEach(function(e){
    const start = entryStartMins(e);
    const label = e.subject || (e.notes ? String(e.notes).slice(0, 40) : "Estudo");
    if (start == null){
      allDay.push({ cls: "tl-chip", title: label + " · " + fmtDuration(entrySeconds(e)), id: e.id, kind: "entry" });
      return;
    }
    const durMin = Math.max(15, Math.round(entrySeconds(e) / 60) || 30);
    const clipped = clipDayMins(start, start + durMin);
    if (clipped) timed.push({ cls: "tl-block entry", title: label, start: clipped.start, end: clipped.end, id: e.id, kind: "entry" });

  const ownedIds = {};
  const days = week.days.slice(0, 7);
  const title = calendarTitle(isCurrentWeek);
  const showToday = calView === "month"
    ? !(monthAnchor().getMonth() === new Date().getMonth() && monthAnchor().getFullYear() === new Date().getFullYear())
    : calView === "split"
      ? (selectedDayIso || toISODate(new Date())) !== toISODate(new Date())
      : !isCurrentWeek;

  if (calView === "split") body = renderSplitView(ownedIds);
  else if (calView === "list") body = renderListView(days, ownedIds);

  else body = renderWeekGrid(days, ownedIds);

function backupDaysAgo(){
  const at = STATE.settings && STATE.settings.lastBackupAt;
  if (!at) return null;
  return Math.floor((Date.now() - at) / 86400000);
}
function backupIsStale(){
  const d = backupDaysAgo();
  return d === null || d >= 7;
}
function openFolderDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(FOLDER_DB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(FOLDER_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function saveFolderHandle(handle){
  const db = await openFolderDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(FOLDER_STORE, "readwrite");
    tx.objectStore(FOLDER_STORE).put(handle, FOLDER_KEY);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function loadFolderHandle(){
  if (!FS_ACCESS_SUPPORTED) return null;
  try {
    const db = await openFolderDB();
    return await new Promise((resolve) => {
      const tx = db.transaction(FOLDER_STORE, "readonly");
      const req = tx.objectStore(FOLDER_STORE).get(FOLDER_KEY);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  } catch (e) { return null; }
}
async function clearFolderHandle(){
  try {
    const db = await openFolderDB();
    await new Promise((resolve) => {
      const tx = db.transaction(FOLDER_STORE, "readwrite");
      tx.objectStore(FOLDER_STORE).delete(FOLDER_KEY);
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    });
  } catch (e) {}
}
async function ensureFolderPermission(handle, requestIfNeeded){
  if (!handle) return false;
  const opts = { mode: "readwrite" };
  try {
    if ((await handle.queryPermission(opts)) === "granted") return true;
    if (!requestIfNeeded) return false;
    return (await handle.requestPermission(opts)) === "granted";
  } catch (e) { return false; }
}
async function initBackupFolder(){
  if (!FS_ACCESS_SUPPORTED) return;
  backupFolderHandle = await loadFolderHandle();
  if (backupFolderHandle && accountOpen) render();
}
async function chooseBackupFolder(){
  if (!FS_ACCESS_SUPPORTED) {
    showToast("Pasta automática: abra no Chrome ou Edge (PC). Ou use Baixar backup.");
    return;
  }
  let handle;
  try {
    handle = await window.showDirectoryPicker({ mode: "readwrite" });
  } catch (e) { return; } // user cancelled the picker
  const ok = await ensureFolderPermission(handle, true);
  if (!ok) { showToast("Permissão negada para essa pasta."); return; }
  await saveFolderHandle(handle);
  backupFolderHandle = handle;
  STATE.settings.backupFolderName = handle.name;
  persist();
  render();
  showToast('Pasta de backup definida: "' + handle.name + '". Os próximos backups vão direto pra lá.');
}
async function forgetBackupFolder(){
  await clearFolderHandle();
  backupFolderHandle = null;
  delete STATE.settings.backupFolderName;
  persist();
  render();
  showToast("Pasta de backup esquecida. Voltando ao download manual.");
}
async function writeBackupToFolder(handle){
  const fileHandle = await handle.getFileHandle(FOLDER_BACKUP_FILENAME, { create: true });
  const writable = await fileHandle.createWritable();
  await writable.write(JSON.stringify(STATE, null, 2));
  await writable.close();
}

function navCal(delta){
  if (calView === "month"){
    const m = monthAnchor();
    const d = new Date(m.getFullYear(), m.getMonth() + delta, 1);
    selectedDayIso = toISODate(d);
    viewWeekStart = mondayOf(d);
  } else if (calView === "split"){
    const iso = selectedDayIso || toISODate(new Date());
    selectedDayIso = toISODate(addDays(parseISODate(iso), delta));
    viewWeekStart = mondayOf(parseISODate(selectedDayIso));
  } else {
    viewWeekStart = addDays(viewWeekStart, delta * 7);
  }
  render();
}
function navWeek(delta){ navCal(delta); }
function setCalView(view){
  calView = view === "split" || view === "list" || view === "month" ? view : "week";
  if (calView === "split" && !selectedDayIso) selectedDayIso = toISODate(new Date());
  if (calView === "split") viewWeekStart = mondayOf(parseISODate(selectedDayIso));
  try { localStorage.setItem("diario-tarefas-cal-view", calView); } catch (e) {}
  render();
}
function selectCalDay(iso){
  selectedDayIso = iso;
  nomenDraftDate = iso;
  viewWeekStart = mondayOf(parseISODate(iso));
  calView = "split";
  try { localStorage.setItem("diario-tarefas-cal-view", calView); } catch (e) {}
  render();
}
function jumpToday(){
  viewWeekStart = mondayOf(new Date());
  selectedDayIso = toISODate(new Date());
  nomenDraftDate = selectedDayIso;
  render();
}

function timerLabelTitle(){
  const parts = [];
  if (timer.task && timer.task.trim()) parts.push("@" + timer.task.trim());
  if (timer.project && timer.project.trim()) parts.push("+" + timer.project.trim());
  if (timer.tags && timer.tags.trim()){

    });
  } else if (freed > 0){
    showToast("Cronômetro livre encerrado (" + fmtDuration(freed) + " não lançados)");
  }
}
function pauseIntoBreak(){
  const s = getPomodoroSettings();
  applyTimerElapsed();
  timer.running = false;
  if (tickTimer){ clearInterval(tickTimer); tickTimer = null; }
  persistRuntime();
  pomo = { active: true, phase: "short", endsAt: Date.now() + s.short * 60 * 1000, pausedRemaining: 0, running: true, posInSet: 1, intervalId: null, resumeTimerAfter: true };
  pomoModalOpen = true;
  getAudioCtx();
  playBreakAlert();
  render();
  startPomodoroTick();
  persistRuntime();
  showToast("Intervalo de " + s.short + " min. O cronômetro volta sozinho no fim.");
}
function pausePomodoro(){
  if (!pomo.active) return;
  pomo.pausedRemaining = pomoRemaining();
  pomo.running = false;
  pomo.endsAt = 0;
  if (pomo.intervalId){ clearInterval(pomo.intervalId); pomo.intervalId = null; }
  render();
  persistRuntime();
}
function resumePomodoro(){
  if (!pomo.active) return;
  pomo.running = true;
  pomo.endsAt = Date.now() + (pomo.pausedRemaining || 0) * 1000;
  render();
  startPomodoroTick();
  persistRuntime();
}
function stopPomodoro(){
  if (pomo.intervalId){ clearInterval(pomo.intervalId); pomo.intervalId = null; }
  const elapsed = pomo.phase === "focus" ? Math.max(0, pomoTotalSeconds() - pomoRemaining()) : 0;
  pomo = { active: false, phase: "focus", endsAt: 0, pausedRemaining: 0, running: false, posInSet: 1, intervalId: null };
  pomoModalOpen = false;
  try { sessionStorage.removeItem("diario-pomo-snapshot"); } catch (e) {}
  if (elapsed > 0){
    const parts = durationParts(elapsed);
    openTaskForm(toISODate(new Date()), "", { hours: parts.hours, mins: parts.mins, seconds: elapsed });
    return;
  }
  render();
}
function skipPomodoroPhase(){
  if (!pomo.active) return;
  if (pomo.intervalId){ clearInterval(pomo.intervalId); pomo.intervalId = null; }
  completePomodoroPhase(true);
}
function startPomodoroTick(){
  if (pomo.intervalId) clearInterval(pomo.intervalId);
  pomo.intervalId = setInterval(function(){
    const rem = pomoRemaining();
    syncPomoDial();
    if (pomo.running && rem <= 0){
      clearInterval(pomo.intervalId);
      pomo.intervalId = null;
      completePomodoroPhase(false);
    }
  }, 250);
}
function completePomodoroPhase(isSkip){
  const s = getPomodoroSettings();
  if (pomo.phase === "focus"){
    playBreakAlert();
    const total = s.focus * 60;
    const elapsed = isSkip ? Math.max(0, total - pomoRemaining()) : total;
    const isLong = pomo.posInSet % s.cyclesUntilLong === 0;
    pomo.phase = isLong ? "long" : "short";
    pomo.running = true;
    pomo.endsAt = Date.now() + (isLong ? s.long : s.short) * 60 * 1000;
    if (elapsed > 0){
      const parts = durationParts(elapsed);
      formMode = "task";
      formPrefill = {
        date: toISODate(new Date()), time: "", title: "", notes: "",
        review: false, amount: 3, unit: "days",
        hours: parts.hours, mins: parts.mins, seconds: elapsed
      };
    }
    render();
    startPomodoroTick();
    persistRuntime();
  } else {
    playResumeAlert();
    if (pomo.resumeTimerAfter){
      if (pomo.intervalId){ clearInterval(pomo.intervalId); pomo.intervalId = null; }
      pomo = { active: false, phase: "focus", endsAt: 0, pausedRemaining: 0, running: false, posInSet: 1, intervalId: null, resumeTimerAfter: false };
      pomoModalOpen = false;
      try { sessionStorage.removeItem("diario-pomo-snapshot"); } catch (e) {}
      startTimer();
      showToast("Intervalo terminou. Cronômetro retomado.");
      return;
    }
    const wasLong = pomo.phase === "long";
    pomo.phase = "focus";
    pomo.running = true;
    pomo.posInSet = wasLong ? 1 : pomo.posInSet + 1;
    pomo.endsAt = Date.now() + s.focus * 60 * 1000;
    render();
    startPomodoroTick();
    persistRuntime();
  }
}
function persistRuntime(){
  try {
    localStorage.setItem("diario-estudos-timer", JSON.stringify(timer));
    if (pomo.active){
      sessionStorage.setItem("diario-pomo-snapshot", JSON.stringify({
        phase: pomo.phase, endsAt: pomo.endsAt, pausedRemaining: pomoRemaining(),
        running: pomo.running, posInSet: pomo.posInSet, resumeTimerAfter: !!pomo.resumeTimerAfter, savedAt: Date.now()
      }));
    } else sessionStorage.removeItem("diario-pomo-snapshot");
  } catch (e) {}
}
function persist(){
  STATE.updatedAt = Date.now();
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); } catch (e) {}
  persistRuntime();
  scheduleAutoBackup();
}
const AUTO_BACKUP_DEBOUNCE_MS = 20000;
const AUTO_BACKUP_DEADLINE_MS = 120000;
let autoBackupDebounceTimer = null;
let autoBackupDeadlineTimer = null;
function scheduleAutoBackup(){
  if (!FS_ACCESS_SUPPORTED) return;
  if (!(STATE.settings && STATE.settings.backupFolderName)) return;
  if (autoBackupDebounceTimer) clearTimeout(autoBackupDebounceTimer);
  autoBackupDebounceTimer = setTimeout(runAutoBackup, AUTO_BACKUP_DEBOUNCE_MS);
  if (!autoBackupDeadlineTimer) autoBackupDeadlineTimer = setTimeout(runAutoBackup, AUTO_BACKUP_DEADLINE_MS);
}
function flushAutoBackup(){
  if (autoBackupDebounceTimer || autoBackupDeadlineTimer) runAutoBackup();
}
async function runAutoBackup(){
  if (autoBackupDebounceTimer) { clearTimeout(autoBackupDebounceTimer); autoBackupDebounceTimer = null; }
  if (autoBackupDeadlineTimer) { clearTimeout(autoBackupDeadlineTimer); autoBackupDeadlineTimer = null; }
  if (!FS_ACCESS_SUPPORTED) return;
  if (!(STATE.settings && STATE.settings.backupFolderName)) return;
  let handle = backupFolderHandle;
  if (!handle) handle = await loadFolderHandle();
  if (!handle) return;
  backupFolderHandle = handle;
  const ok = await ensureFolderPermission(handle, false); // never prompt from the background
  if (!ok) return;
  try {
    await writeBackupToFolder(handle);
    STATE.settings.lastBackupAt = Date.now();
    STATE.updatedAt = Date.now();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); } catch (e) {}
    if (accountOpen) render();
  } catch (e) {}
}
function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw){
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.entries)) STATE = parsed;
    }
  } catch (e) {}
  ensureLists();
  if (!STATE.entries.length){
    try {
      const oldRaw = localStorage.getItem("conta-estudo-v1");
      if (oldRaw){
        const old = JSON.parse(oldRaw);
        const entries = [];
        Object.keys(old.days || {}).forEach(function(date){
          const day = old.days[date];
          (day.sessions || []).forEach(function(s, idx){
            entries.push({
              id: s.id || uid(),
              date: date,
              seconds: s.seconds || 0,
              subject: s.subject || "",
              notes: idx === 0 ? (day.notes || "") : "",
              source: s.kind === "manual" ? "manual" : "free",
              createdAt: new Date(s.endedAt || Date.now()).toISOString()
            });
          });
        });
        if (entries.length){ STATE.entries = entries; persist(); }
      }
    } catch (e) {}
  }
  if (migrationDirty){
    migrationDirty = false;
    STATE.updatedAt = Date.now();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); } catch (e) {}
  }
  try {
    const t = JSON.parse(localStorage.getItem("diario-estudos-timer") || "null");
    if (t && (t.running || t.accumulated || t.task || t.project || t.tags)) timer = t;
    if (timer.running && timer.startedAt) startTimerTick();
  } catch (e) {}
  try { muted = localStorage.getItem("diario-estudos-muted") === "1"; } catch (e) {}
  try {
    const stored = localStorage.getItem("diario-estudos-theme");
    if (stored === "light" || stored === "dark") theme = stored;
    else theme = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  } catch (e) {}
  try { logOpen = localStorage.getItem("diario-tarefas-log-open") !== "0"; } catch (e) {}
  try {
    const v = localStorage.getItem("diario-tarefas-cal-view");
    if (v === "split" || v === "list" || v === "month" || v === "week") calView = v;
  } catch (e) {}
  selectedDayIso = toISODate(new Date());
  applyTheme();
  try {
    const snap = JSON.parse(sessionStorage.getItem("diario-pomo-snapshot") || "null");
    if (snap && snap.phase){
      sessionStorage.removeItem("diario-pomo-snapshot");
      let remaining = snap.pausedRemaining;
      if (snap.running && snap.endsAt) remaining = Math.round((snap.endsAt - Date.now()) / 1000);
      pomo = { active: true, phase: snap.phase, endsAt: snap.running ? Date.now() + Math.max(0, remaining) * 1000 : 0, pausedRemaining: Math.max(0, remaining || 0), running: !!snap.running, posInSet: snap.posInSet || 1, intervalId: null, resumeTimerAfter: !!snap.resumeTimerAfter };
      if (pomo.running && pomoRemaining() <= 0) completePomodoroPhase(false);
      else if (pomo.running) startPomodoroTick();
    }
  } catch (e) {}
}
function mergeDiary(remote){
  if (!remote) return;
  if (!Array.isArray(remote.entries)) return;
  const remoteAt = remote.updatedAt || 0;
  const deleted = mergeTombstones(remote.deleted, tombstones());
  STATE = {
    entries: mergeById(remote.entries, STATE.entries, deleted),
    tasks: mergeById(remote.tasks, STATE.tasks, deleted),
    agenda: mergeById(remote.agenda, STATE.agenda, deleted),
    tags: STATE.tags,
    projects: STATE.projects,
    deleted: deleted,
    settings: (remoteAt > (STATE.updatedAt || 0) ? (remote.settings || STATE.settings) : (STATE.settings || remote.settings || {})),
    updatedAt: Math.max(remoteAt, STATE.updatedAt || 0)
  };
  ensureLists();
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); } catch (e) {}
}
async function exportJson(){
  let handle = backupFolderHandle;
  if (!handle && FS_ACCESS_SUPPORTED && STATE.settings && STATE.settings.backupFolderName) {
    handle = await loadFolderHandle();
    backupFolderHandle = handle;
  }
  if (handle) {
    const ok = await ensureFolderPermission(handle, true);
    if (ok) {
      try {
        await writeBackupToFolder(handle);
        STATE.settings.lastBackupAt = Date.now();
        persist();
        render();
        showToast('Backup salvo em "' + handle.name + '".');
        return;
      } catch (e) {
        showToast("Não consegui salvar na pasta escolhida. Baixando o arquivo normalmente.");
      }
    } else {
      showToast("Sem permissão para a pasta escolhida. Baixando o arquivo normalmente.");
    }
  }
  const blob = new Blob([JSON.stringify(STATE, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "diario-tarefas-" + toISODate(new Date()) + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
  STATE.settings.lastBackupAt = Date.now();
  persist();
  render();
  showToast("Backup baixado. Guarde-o na sua pasta do Drive.");
}
function importJson(file){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(){
    try {
      const parsed = JSON.parse(reader.result);
      if (!parsed || !Array.isArray(parsed.entries)) throw new Error("invalid");
      const before = (STATE.tasks || []).length + (STATE.entries || []).length + (STATE.agenda || []).length;
      mergeDiary(parsed);
      const after = (STATE.tasks || []).length + (STATE.entries || []).length + (STATE.agenda || []).length;
      persist();
      render();
      const added = after - before;
      showToast(added > 0
        ? ("Backup combinado. " + added + " item" + (added === 1 ? "" : "ns") + " a mais.")
        : "Backup combinado. Nada de novo neste arquivo.");
    } catch (e) { showToast("Arquivo inválido"); }
  };
  reader.readAsText(file);
}

document.addEventListener("visibilitychange", function(){
  if (document.visibilityState === "visible"){
    if (timer.running) applyTimerElapsed();
    if (pomo.active && pomo.running && pomoRemaining() <= 0) completePomodoroPhase(false);
    persistRuntime();
  }
});
document.addEventListener("keydown", function(e){
  if (e.key === "Escape"){ formMode = null; accountOpen = false; render(); }
});
window.addEventListener("beforeunload", persistRuntime);

viewWeekStart = mondayOf(new Date());
loadState();
render();
initBackupFolder();
document.addEventListener("visibilitychange", function(){ if (document.hidden) flushAutoBackup(); });
window.addEventListener("pagehide", flushAutoBackup);
</script>
