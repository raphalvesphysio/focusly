[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/legacy"
  to = "/legacy/index.html"
  status = 200

[[redirects]]
  from = "/legacy/*"
  to = "/legacy/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
